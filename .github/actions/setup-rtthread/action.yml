name: Set up RT-Thread build
description: Install pinned Python dependencies and ARM GCC for RT-Thread package CI.

inputs:
  python-version:
    description: Python version used by SCons and RT-Thread Env.
    required: false
    default: '3.11'
  requirements-path:
    description: Pinned Python requirements file.
    required: false
    default: .github/ci/qboot/requirements.txt
  arm-gcc-dir:
    description: Fixed toolchain installation directory.
    required: false
    default: /opt/gcc-arm-none-eabi

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.requirements-path }}

    - name: Install host build dependencies
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update -qq \
          -o Acquire::Retries=5 \
          -o Acquire::http::Timeout=30 \
          -o Acquire::https::Timeout=30
        timeout 20m sudo apt-get install -y --no-install-recommends \
          -o Acquire::Retries=5 \
          -o Acquire::http::Timeout=30 \
          -o Acquire::https::Timeout=30 \
          bzip2 ca-certificates git make wget
        python -m pip install --disable-pip-version-check -r '${{ inputs.requirements-path }}'

    - name: Prepare ARM GCC cache directory
      shell: bash
      run: |
        set -euo pipefail
        sudo mkdir -p '${{ inputs.arm-gcc-dir }}'
        sudo chown -R "$USER:$(id -gn)" '${{ inputs.arm-gcc-dir }}'

    - name: Cache ARM GCC toolchain
      id: cache-arm-gcc
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.arm-gcc-dir }}
        key: ${{ runner.os }}-arm-gcc-10.3-2021.10-v1

    - name: Install ARM GCC on cache miss
      if: steps.cache-arm-gcc.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        archive='gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2'
        archive_path="$RUNNER_TEMP/$archive"
        url="https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/$archive"
        expected_md5='2383e4eb4ea23f248d33adc70dc3227e'

        wget --tries=5 --timeout=30 --output-document="$archive_path" "$url"
        printf '%s  %s\n' "$expected_md5" "$archive_path" | md5sum --check --status

        rm -rf '${{ inputs.arm-gcc-dir }}'/*
        tar -xjf "$archive_path" -C '${{ inputs.arm-gcc-dir }}' --strip-components=1
        test -x '${{ inputs.arm-gcc-dir }}/bin/arm-none-eabi-gcc'

    - name: Export build environment
      shell: bash
      run: |
        set -euo pipefail
        {
          printf 'RTT_CC=gcc\n'
          printf 'RTT_EXEC_PATH=%s/bin\n' '${{ inputs.arm-gcc-dir }}'
        } >> "$GITHUB_ENV"
        printf '%s/bin\n' '${{ inputs.arm-gcc-dir }}' >> "$GITHUB_PATH"
        '${{ inputs.arm-gcc-dir }}/bin/arm-none-eabi-gcc' --version
        python --version
        scons --version
